<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="222" viewBox="0 0 1080 222" role="img" aria-labelledby="title description"><title id="title">VERIFY THE RECORD</title><desc id="description">Evidence others can check. No dashboard trust required.</desc><rect width="1080" height="222" rx="14" fill="#111827"/><text x="540" y="32" font-family="Arial,sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#f8fafc">VERIFY THE RECORD</text><text x="540" y="54" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b9c4d4">Evidence others can check. No dashboard trust required.</text><rect x="18" y="78" width="232" height="112" rx="10" fill="#1b2940" stroke="#64748b" stroke-width="2"/><rect x="18" y="78" width="232" height="5" rx="3" fill="#64748b"/><text x="134" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#64748b">PRESERVE</text><text x="134" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Evidence package</text><text x="134" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b9c4d4">provenance included</text><path d="M258 133 h20 m-8 -6 l8 6 l-8 6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="288" y="78" width="232" height="112" rx="10" fill="#1b2940" stroke="#2563eb" stroke-width="2"/><rect x="288" y="78" width="232" height="5" rx="3" fill="#2563eb"/><text x="404" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">CHECK</text><text x="404" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Hashes + attestations</text><text x="404" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b9c4d4">supported checks only</text><path d="M528 133 h20 m-8 -6 l8 6 l-8 6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="558" y="78" width="232" height="112" rx="10" fill="#1b2940" stroke="#d49c35" stroke-width="2"/><rect x="558" y="78" width="232" height="5" rx="3" fill="#d49c35"/><text x="674" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#d49c35">REPORT</text><text x="674" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Passed / failed</text><text x="674" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b9c4d4">or untested</text><path d="M798 133 h20 m-8 -6 l8 6 l-8 6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="828" y="78" width="232" height="112" rx="10" fill="#1b2940" stroke="#0f766e" stroke-width="2"/><rect x="828" y="78" width="232" height="5" rx="3" fill="#0f766e"/><text x="944" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e">HAND OVER</text><text x="944" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Repeatable review</text><text x="944" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b9c4d4">independent verifier</text></svg>