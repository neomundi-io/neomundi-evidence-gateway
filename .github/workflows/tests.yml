# Integration continue du NeoMundi Evidence Gateway.
#
# Deux jobs, et la separation est le point important :
#
#   « contrat du gateway (sans moteur) » est OBLIGATOIRE. Il eprouve tout ce
#   qui ne depend pas du moteur -- les enveloppes, les raisons de refus, les
#   codes 3 et 4, et l absence de logique de verification dans le produit.
#   Il reste vert quand le moteur est prive, parce qu il ne lui demande rien.
#
#   « confrontation au moteur (si atteignable) » tente de recuperer le
#   moteur PRIVE. Il n est plus atteignable en anonyme depuis le 14/11, donc
#   le job NE MENT PAS : il imprime ce qui n a pas ete eprouve et s arrete
#   la. Un job qui se contenterait de passer laisserait croire que la
#   confrontation a eu lieu.
#
#   ⚠ Depuis la publication de `verifier/`, les cas 1 a 3 et l epreuve C
#   tournent dans le job OBLIGATOIRE, sur la surface publique. Ce second job
#   ne vaut plus que pour une chose : confronter le gateway au moteur
#   PRIVE lui-meme, quand l executant y a acces.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrat:
    name: contrat du gateway (sans moteur, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Les memes versions que la CI du moteur. 3.9 et 3.10 ne sont PAS
        # offertes par les runners Ubuntu 26.04 : les declarer rendrait un
        # job rouge qui ne dit rien du produit.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer jsonschema
        # OPTIONNELLE pour le produit, employee par les suites pour valider
        # les enveloppes contre les contrats publies. Sans elle le controle
        # rend NOT TESTED -- jamais PASS.
        run: python -m pip install --disable-pip-version-check --quiet jsonschema

      - name: Les contrats sont du JSON valide, et fermes
        run: |
          python - <<'PY'
          import json, pathlib, sys
          echecs = 0
          for f in sorted(pathlib.Path("contracts").glob("*.json")):
              charge = json.loads(f.read_text(encoding="utf-8"))
              if charge.get("additionalProperties") is not False:
                  print(f"FAIL {f} : additionalProperties doit valoir false")
                  echecs += 1
              else:
                  print(f"PASS {f} : {charge['$id']}")
          sys.exit(1 if echecs else 0)
          PY

      - name: Les requetes d exemple sont conformes au contrat de requete
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import jsonschema
          schema = json.loads(pathlib.Path("contracts/gateway-request-v1.json").read_text(encoding="utf-8"))
          echecs = 0
          for f in sorted(pathlib.Path("examples").glob("*.json")):
              charge = json.loads(f.read_text(encoding="utf-8"))
              attendu_invalide = "rejected" in f.name
              try:
                  jsonschema.validate(charge, schema)
                  valide = True
              except jsonschema.ValidationError as exc:
                  valide = False
                  motif = exc.message
              if valide and attendu_invalide:
                  print(f"FAIL {f} : attendu INVALIDE, mais conforme")
                  echecs += 1
              elif not valide and not attendu_invalide:
                  print(f"FAIL {f} : {motif}")
                  echecs += 1
              else:
                  print(f"PASS {f} : {'invalide comme attendu' if attendu_invalide else 'conforme'}")
          sys.exit(1 if echecs else 0)
          PY

      - name: Le magasin de confiance publie porte bien l empreinte annoncee
        run: python tests/test_trust_store.py

      - name: Le corpus public de conformite est celui que nous annoncons
        run: python tests/test_corpus_public.py

      - name: Cas 4 et 5 -- aucune verification n a lieu, et le code le dit
        run: python tests/test_gateway.py

      - name: Aucune logique de verification dans le produit (epreuves A et B)
        run: python tests/test_no_verification_logic.py

      - name: La demonstration joue ses deux scenarios sans moteur
        run: sh demo/demo.sh --no-engine

      - name: Les CINQ scenarios, sur la surface publique de verification
        # C est ce que la publication de `verifier/` rend possible : les cas
        # 1 a 3 et l epreuve C tournent ici SANS aucun acces prive. Avant,
        # ils rendaient NOT TESTED dans ce job.
        env:
          EVIDENCE_ENGINE_HOME: ${{ github.workspace }}/verifier
        run: |
          python tests/test_gateway.py
          python tests/test_no_verification_logic.py
          sh demo/demo.sh

      - name: Le corpus public se joue avec le verificateur Python
        working-directory: verifier/conformance
        run: |
          python runners/run.py --verifier python

      - name: Aucun CRLF dans les sources suivies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          suivis = subprocess.run(["git", "ls-files"], capture_output=True, text=True,
                                  check=True).stdout.split()
          # Les fixtures du corpus sont des ZIP, des JWS et des OTS : un
          # CRLF y est un octet compresse, pas une fin de ligne. Les
          # confronter rendrait un faux positif sur 14 fichiers.
          BINAIRES = (".zip", ".jws", ".ots", ".bin", ".lock")
          fautifs = []
          ignores = 0
          for nom in suivis:
              chemin = pathlib.Path(nom)
              if not chemin.is_file():
                  continue
              if chemin.suffix.lower() in BINAIRES:
                  ignores += 1
                  continue
              if chemin.read_bytes().count(b"\r\n"):
                  fautifs.append(nom)
          for nom in fautifs:
              print(f"FAIL {nom} : porte des CRLF")
          print(f"{len(suivis)} fichier(s) suivi(s), {ignores} binaire(s) ecarte(s)")
          sys.exit(1 if fautifs else 0)
          PY

  moteur:
    name: confrontation au moteur (si atteignable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gateway

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer jsonschema et cryptography
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            jsonschema cryptography

      - name: Recuperer le moteur, s il est atteignable
        id: moteur
        run: |
          # AUCUN jeton : si le moteur est prive, ce clone echoue, et c est
          # le resultat attendu -- pas une panne de CI.
          if git clone --depth 1 \
               https://github.com/neomundi-io/neomundi-evidence-public.git engine 2>/dev/null; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
            echo "revision=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "moteur recupere : $(git -C engine rev-parse --short HEAD)"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "le moteur n est pas atteignable sans autorisation."
          fi

      - name: Cas 1 a 3 et epreuve C -- le verdict est celui du moteur
        if: steps.moteur.outputs.disponible == 'true'
        working-directory: gateway
        env:
          EVIDENCE_ENGINE_HOME: ${{ github.workspace }}/engine
          EVIDENCE_ENGINE_REVISION: ${{ steps.moteur.outputs.revision }}
        run: |
          python tests/test_gateway.py
          python tests/test_no_verification_logic.py

      - name: Les cinq scenarios de la demonstration
        if: steps.moteur.outputs.disponible == 'true'
        working-directory: gateway
        env:
          EVIDENCE_ENGINE_HOME: ${{ github.workspace }}/engine
        run: sh demo/demo.sh

      - name: CE QUI N A PAS ETE EPROUVE
        if: steps.moteur.outputs.disponible != 'true'
        run: |
          echo "NOT TESTED -- le moteur PRIVE n a pas pu etre recupere sans"
          echo "autorisation, et c est le resultat attendu depuis le 14/11."
          echo ""
          echo "Ce qui N A PAS ete eprouve ici : la confrontation du gateway au"
          echo "moteur PRIVE lui-meme. Ce job est vert parce qu il n a rien a"
          echo "reprocher au gateway, NON parce que cette confrontation a eu lieu."
          echo ""
          echo "En revanche les cas 1 a 3, l epreuve C et les cinq scenarios ONT"
          echo "tourne dans le job « contrat du gateway », sur la surface"
          echo "publique de verification -- voir verifier/README.md."
